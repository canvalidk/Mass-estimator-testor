name: reference-single-reading
question: >-
  For one reading, does the cartesian reference (flat in the latent vector's
  components) estimate mass as well as the flat-magnitude reference, in 1D
  and 3D, across masses and excitation strengths?
notes: >-
  The two references coincide in 2D, so 2D is left out. Masses in units of
  s = sigma_F / sigma_a. Everything else is identical between the two
  estimators; they see the same readings.
world:
  dimension: [1, 3]
  design: same_pair
  mass: [0.25, 1, 4]
  acceleration_snr: [0.5, 1, 2, 4, 8]
  direction: fixed
  readings: 1
  noise: {force_sd: 1, acceleration_sd: 1}
  supplied_noise: exact
estimators:
  - name: flat
    reduce: none
    law: {reference: flat, nuisance: radius}
    combine: {rule: single, prior: []}
    readouts: [ratio_of_means, median, interval_95]
  - name: cartesian
    reduce: none
    law: {reference: cartesian, nuisance: radius}
    combine: {rule: single, prior: []}
    readouts: [ratio_of_means, median, interval_95]
scores:
  within_factor: [1.25, 1.5, 2]
replicates: 2000
seed: 20260928
