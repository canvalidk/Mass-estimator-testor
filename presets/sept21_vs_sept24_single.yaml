name: sept21-vs-sept24-single
question: >-
  For one reading, where and by how much does the 24 September law (flat in the
  pair as a vector) move the readouts away from the 21 September law (flat in the
  two magnitudes), in 1D, 2D and 3D?
notes: >-
  sept21 is the equation in VD-docs mass_estimator_equation/ (reference flat);
  sept24 is excitation_weighting_premise_2026-09-24 section 3 (reference
  cartesian). The two are the same measure times r^(d-2), r the candidate pair's
  length in noise units, so 2D is a null control: every series must agree
  exactly. Masses are in units of s = sigma_F / sigma_a (both SDs are 1). One
  reading, so the direction does not matter (rotation invariance).
world:
  dimension: [1, 2, 3]
  design: same_pair
  mass: [0.25, 1, 4]
  acceleration_snr: [0.25, 0.5, 1, 2, 4, 8]
  direction: fixed
  readings: 1
  noise: {force_sd: 1, acceleration_sd: 1}
  supplied_noise: exact
estimators:
  - name: sept21
    reduce: none
    law: {reference: flat, nuisance: radius}
    combine: {rule: single, prior: []}
    readouts: [ratio_of_means, median, interval_95, interval_80]
  - name: sept24
    reduce: none
    law: {reference: cartesian2, nuisance: radius}
    combine: {rule: single, prior: []}
    readouts: [ratio_of_means, median, interval_95, interval_80]
scores:
  within_factor: [1.25, 1.5, 2]
  compare_to: sept21
replicates: 4000
seed: 20260925
