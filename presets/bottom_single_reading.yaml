name: bottom-single-reading
question: >-
  At the bottom (one reading, weak excitation), does the hierarchical
  excitation prior change how the ratio of means compares with the median and
  reciprocal-root readouts, and how far is each from the oracles?
notes: >-
  Contribution 12's bottom: at acceleration SNR 0.5 the flat law's median and
  reciprocal-root points beat the ratio of means. Oracles are declared:
  known_beta is the hierarchical rule told the true excitation scale;
  known_excitation is told the true acceleration vector and fits only the force
  (a ceiling no readings-only method can reach). Masses in units of
  s = sigma_F / sigma_a.
world:
  dimension: 3
  design: same_pair
  mass: [0.25, 1, 4]
  acceleration_snr: [0.5, 1, 2, 4, 8]
  direction: random
  readings: 1
  noise: {force_sd: 1, acceleration_sd: 1}
  supplied_noise: exact
estimators:
  - name: flat
    reduce: none
    law: {reference: flat, nuisance: radius}
    combine: {rule: single, prior: []}
    readouts: [ratio_of_means, median, reciprocal_root, interval_95]
  - name: hierarchical
    reduce: none
    law: {reference: cartesian, nuisance: radius}
    combine: {rule: hierarchical, prior: [{uniform_angle: {center: first_reading}}], excitation: {beta_b: 1}}
    readouts: [ratio_of_means, median, reciprocal_root, interval_95]
  - name: oracle_known_beta
    oracle: known_beta
    reduce: none
    law: {reference: cartesian, nuisance: radius}
    combine: {rule: hierarchical, prior: [{uniform_angle: {center: first_reading}}], excitation: {beta_b: 1}}
    readouts: [ratio_of_means, median, interval_95]
  - name: oracle_known_excitation
    oracle: known_excitation
    readouts: [ratio_of_means, median, interval_95]
  - name: vector_length
    direct: norm_ratio
    reduce: pool_pair
scores:
  within_factor: [1.25, 1.5, 2]
replicates: 2000
seed: 20261001
