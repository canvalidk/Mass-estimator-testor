name: ours29-noise-vs-signal
question: >-
  Does ours29 (each reading weighted by its own misfit, the product raised to the Bartlett
  power eta) keep its quoted 95% intervals honest from pure noise to strong signal, in 1D, 2D
  and 3D, and what do the raw law and the point do meanwhile?
notes: >-
  30 September (noise_vs_signal/ours29 record). ours27 here is the cartesian likelihood
  product with isotropic noise (ours24/ours25b's law), the base ours29 tempers. ours29_law is
  ours29 with eta = 1 (misfit weight only): its interval is the RAW LAW's; ours29 is the
  QUOTED width. Both are reported, per his ruling of 30 Sept, 11:57 ("we can report both for
  now"). ours25 (the Bessel-corrected sandwich searched on m > 0) is kept for comparison: it
  counts readings, so it is not Z-invariant, and it falls back to the prior when the best line
  is at negative mass. acceleration_snr 0 is pure instrument noise: coverage there is against
  a fixed planted mass and says how far the law leans without signal (the prior centre is 1).
  Prediction from the sandbox (1D): ours27 null coverage falls with N; ours29 holds it; strong
  signal eta ~ 1. The misfit weight acts only in 2D and 3D.
world:
  dimension: [1, 2, 3]
  design: new_excitation
  mass: [0.25, 1, 4]
  acceleration_snr: [0, 0.5, 1, 3]
  direction: random
  readings: [20, 200]
  noise: {force_sd: 1, acceleration_sd: 1}
  supplied_noise: exact
estimators:
  - name: ours27
    reduce: none
    law: {reference: cartesian2, nuisance: radius}
    combine: {rule: likelihood_product, prior: [{uniform_angle: {center: first_reading}}]}
    readouts: [ratio_of_means_rss, median, interval_95]
  - name: ours29_law
    reduce: none
    law: {reference: cartesian2, nuisance: radius}
    combine: {rule: likelihood_product, prior: [{uniform_angle: {center: first_reading}}], misfit: kink}
    readouts: [ratio_of_means_rss, median, interval_95]
  - name: ours29
    reduce: none
    law: {reference: cartesian2, nuisance: radius}
    combine:
      rule: likelihood_product
      prior: [{uniform_angle: {center: first_reading}}]
      misfit: kink
      calibrate: bartlett
    readouts: [ratio_of_means_rss, median, interval_95]
  - name: ours25
    reduce: none
    law: {reference: cartesian2, nuisance: radius}
    combine: {rule: likelihood_product, prior: [{uniform_angle: {center: first_reading}}], calibrate: sandwich}
    readouts: [ratio_of_means_rss, median, interval_95]
scores:
  within_factor: [1.25, 2]
  compare_to: ours27
replicates: 200
seed: 20260930
