  (E[1/v | the reading], L21's cut read as T37 reads it), and what does ours32's eta do at the
  truth, in ours31's own world (v ~ InvGamma(nu/2, nu/2), nu = 10) and in the fixed-size Gaussian,
  beside ours30's g and eta?
notes: >-
