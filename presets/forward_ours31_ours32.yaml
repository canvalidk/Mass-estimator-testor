  extra half not counted in the size posterior: shows near the boundary, angle 85) and 3 (weak
  signal not modelled in the size posterior: shows at small push). w31 is the cut factor's local
  weight at the reading's best line, (nu + k - 1)/(nu + Q+); calibrated means equal to the mean true
  precision 1/v overall and in every decile of the weight. sigma_F = sigma_a = 1.
