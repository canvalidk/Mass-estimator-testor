name: bottom-repeated
question: >-
  With 50 readings sharing only the mass, how far are the symmetric and
  hierarchical rules from the best possible: the hierarchical rule told the
  true excitation scale, and a method told the true accelerations?
notes: >-
  Same worlds as excitation-hierarchy. Oracles are declared by name
  (known_beta, known_excitation) and are the only estimators that see any truth.
world:
  dimension: 3
  design: new_excitation
  mass: [0.25, 1, 4]
  acceleration_snr: [1, 3, {normal_rms: 1}, {normal_rms: 3}]
  direction: random
  readings: 50
  noise: {force_sd: 1, acceleration_sd: 1}
  supplied_noise: exact
estimators:
  - name: symmetric_flat
    reduce: none
    law: {reference: flat, nuisance: radius}
    combine: {rule: likelihood_product, prior: [{uniform_angle: {center: first_reading}}]}
    readouts: [ratio_of_means, median, interval_95, interval_80]
  - name: hierarchical
    reduce: none
    law: {reference: cartesian, nuisance: radius}
    combine: {rule: hierarchical, prior: [{uniform_angle: {center: first_reading}}], excitation: {beta_b: 1}}
    readouts: [ratio_of_means, median, interval_95, interval_80]
  - name: oracle_known_beta
    oracle: known_beta
    reduce: none
    law: {reference: cartesian, nuisance: radius}
    combine: {rule: hierarchical, prior: [{uniform_angle: {center: first_reading}}], excitation: {beta_b: 1}}
    readouts: [ratio_of_means, median, interval_95, interval_80]
  - name: oracle_known_excitation
    oracle: known_excitation
    readouts: [ratio_of_means, median, interval_95, interval_80]
scores:
  within_factor: [1.1, 1.25, 1.5]
replicates: 500
seed: 20261002
