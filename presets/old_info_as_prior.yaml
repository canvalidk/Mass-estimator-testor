name: old-info-as-prior
question: >-
  When the readings before the last one are compressed into the prior slot,
  how much of the exact answer survives? Compared: the exact joint law, the
  old law kept as a whole curve, and the old law fitted by two numbers
  (a log-normal, or the tilted half-Cauchy of contribution 12).
notes: >-
  Under the rule that counts the prior once, the exact law of N+1 readings is
  the old readings' law times the new reading's likelihood, so the old
  information sits exactly where a prior does (DESIGN.md; analyst.py, the
  sequential rule). `curve_only` keeps the whole old curve but drops the old
  E[alpha | m], which the ratio of means needs. The fits keep two numbers of
  the old law, its mean and SD in log m: `lognormal_fit` as a normal law in
  log m, `tilt_fit` as sech(z) exp(lambda (sech z - 1)) with m0 and lambda
  set by those two moments. The world is new_excitation, where readings share
  only the mass, so the old information is about the mass alone.
world:
  dimension: 3
  design: new_excitation
  mass: [0.25, 1, 4]
  acceleration_snr: [1, 3]
  direction: random
  readings: [2, 6, 21]
  noise: {force_sd: 1, acceleration_sd: 1}
  supplied_noise: exact
estimators:
  - name: exact
    reduce: none
    law: {reference: flat, nuisance: radius}
    combine:
      rule: sequential
      carry: exact
      old: {rule: likelihood_product, prior: [{uniform_angle: {center: first_reading}}]}
    readouts: [ratio_of_means, median, interval_95]
  - name: curve_only
    reduce: none
    law: {reference: flat, nuisance: radius}
    combine:
      rule: sequential
      carry: curve_only
      old: {rule: likelihood_product, prior: [{uniform_angle: {center: first_reading}}]}
    readouts: [ratio_of_means, median, interval_95]
  - name: lognormal_fit
    reduce: none
    law: {reference: flat, nuisance: radius}
    combine:
      rule: sequential
      carry: lognormal_fit
      old: {rule: likelihood_product, prior: [{uniform_angle: {center: first_reading}}]}
    readouts: [ratio_of_means, median, interval_95]
  - name: tilt_fit
    reduce: none
    law: {reference: flat, nuisance: radius}
    combine:
      rule: sequential
      carry: tilt_fit
      old: {rule: likelihood_product, prior: [{uniform_angle: {center: first_reading}}]}
    readouts: [ratio_of_means, median, interval_95]
scores:
  within_factor: [1.1, 1.25, 1.5]
  compare_to: exact
replicates: 1000
seed: 20260926
