  dimension: [2, 3]
  design: new_excitation
  mass: [0.25, 1.0, 4.0]
  acceleration_snr: [0.0, 0.5, 1.0, 2.0, 5.0]
  direction: random
  readings: [5, 20, 400]
  noise: {force_sd: 1.0, acceleration_sd: 1.0}
  supplied_noise: exact
