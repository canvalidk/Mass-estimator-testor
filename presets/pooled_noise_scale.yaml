kind: pooled_scale
name: pooled-noise-scale
question: >-
  Does the mean of separately profiled whole-line misfits estimate the declared
  variance scale across signal strengths, and how does its finite-N spread compare
  with the paired Bartlett powers, which have a different target?
notes: >-
  O14 pressure check of the proposed covariance-up-to-scale branch. The investigator
  knows the covariance to check the estimator; residual_statistics receives only
  readings and supplied SDs. The target pooled variance multiplier is 1. Neither
  Bartlett power estimates that multiplier. No replacement equation is adopted.
