name: ours26-per-axis-noise
question: >-
  With a different noise SD on each axis, does ours26 give one answer for a 3D
  series and for its axes, how far does the prior's centre (no longer forced)
  move that answer, and how close does ours26 come to the known-excitation
  ceiling?
notes: >-
  ours26 is ours25b with per-axis noise (26 September). The law is the per-axis
  Beale sum, sum_i sum_k -(F_ik - m a_ik)^2 / (2 (sigma_F,k^2 + m^2 sigma_a,k^2)),
  forced by axis splitting; the readout is ours25b's E|F*_stack| / E|a*_stack|, its
  weight now a weighted noncentral chi mean (quadrature). What is not forced is
  the centre of the uniform-angle prior: the axes have ratios sigma_F/sigma_a of
  5, 2 and 0.8, so there is no single instrument ratio. `ours26` declares the
  geometric mean of the first reading's axis ratios (2); `centre_low` and
  `centre_high` put it at the smallest and largest axis ratio instead, to measure
  what the open choice is worth. `ours26_axes` is the same estimator on the
  readings split into 3N one-dimensional ones: its agreement rows must be zero to
  rounding (axis splitting). The oracle is told every true acceleration vector.
  acceleration_snr is measured against the RMS of the axes' acceleration SDs.
world:
  dimension: 3
  design: new_excitation
  mass: [0.5, 2, 8]
  acceleration_snr: [1, 3, 10]
  direction: random
  readings: [1, 5]
  noise:
    force_sd: {per_axis: [1, 1, 1]}
    acceleration_sd: {per_axis: [0.2, 0.5, 1.25]}
  supplied_noise: exact
estimators:
  - name: ours26
    reduce: none
    law: {reference: cartesian2, nuisance: radius}
    combine: {rule: likelihood_product, prior: [{uniform_angle: {center: first_reading_geometric}}]}
    readouts: [ratio_of_means_rss, median, interval_95]
  - name: ours26_axes
    reduce: split_axes
    law: {reference: cartesian2, nuisance: radius}
    combine: {rule: likelihood_product, prior: [{uniform_angle: {center: first_reading_geometric}}]}
    readouts: [ratio_of_means_rss, median, interval_95]
  - name: centre_low
    reduce: none
    law: {reference: cartesian2, nuisance: radius}
    combine: {rule: likelihood_product, prior: [{uniform_angle: {center: 0.8}}]}
    readouts: [ratio_of_means_rss, median, interval_95]
  - name: centre_high
    reduce: none
    law: {reference: cartesian2, nuisance: radius}
    combine: {rule: likelihood_product, prior: [{uniform_angle: {center: 5}}]}
    readouts: [ratio_of_means_rss, median, interval_95]
  - name: oracle
    oracle: known_excitation
    readouts: [ratio_of_means, median, interval_95]
scores:
  within_factor: [1.25, 2]
  compare_to: ours26
replicates: 400
seed: 20260926
